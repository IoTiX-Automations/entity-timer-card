set:
  name: Set timer
  description: >-
    Turn an entity on or off immediately and schedule reverting it back
    at a given date & time. Replaces any existing pending timer for
    the same entity.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity: {}
    state:
      name: State
      description: The state to apply now.
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"
    until:
      name: Until
      description: When to revert the entity to its previous state.
      required: true
      selector:
        datetime: {}

cancel:
  name: Cancel timer
  description: >-
    Cancel a pending timer for an entity, immediately reverting it to
    its normal state instead of waiting for the scheduled time.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity: {}
